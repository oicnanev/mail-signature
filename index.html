<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de assinatura</title>
<style>
  :root { --bg:#f5f3ef; --card:#fff; --text:#1c1a18; --muted:#6b665f; --line:#ddd8d0; --orange:#f7a645; --error:#a4400b; --ok:#2f6b3a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui, sans-serif; }
  main { max-width:1180px; margin:0 auto; padding:24px 16px 48px; display:grid; gap:24px; grid-template-columns:minmax(280px,380px) 1fr; align-items:start; }
  @media (max-width:860px) { main { grid-template-columns:1fr; } }
  h1 { grid-column:1/-1; margin:0; font-size:1.4rem; }
  form, .preview-panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; }
  label { display:block; margin-top:12px; font-size:.85rem; font-weight:600; }
  label:first-child { margin-top:0; }
  input[type=text], input[type=url], textarea { width:100%; margin-top:4px; padding:8px 10px; font:inherit; border:1px solid var(--line); border-radius:6px; background:#fff; color:inherit; }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline:3px solid var(--orange); outline-offset:1px; }
  fieldset { border:0; margin:16px 0 0; padding:0; display:flex; gap:20px; }
  fieldset label { margin:0; font-weight:400; font-size:1rem; }
  legend { font-size:.85rem; font-weight:600; padding:0; margin-bottom:6px; }
  small { display:block; margin-top:4px; color:var(--muted); font-size:.8rem; }
  .status { font-size:.85rem; margin-top:6px; }
  .status.error { color:var(--error); } .status.ok { color:var(--ok); }
  .preview-panel { overflow-x:auto; }
  .preview-panel h2 { margin:0 0 12px; font-size:.85rem; color:var(--muted); font-weight:600; }
  #preview { background:#e9e5de; padding:20px; border-radius:6px; min-width:640px; }
  .actions { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-top:16px; }
  button { font:inherit; font-weight:600; padding:10px 18px; border-radius:6px; border:1px solid var(--text); background:var(--text); color:#fff; cursor:pointer; }
  button.secondary { background:transparent; color:var(--text); }
  #message { font-size:.9rem; color:var(--ok); }
</style>
</head>
<body>
<main>
  <h1>Gerador de assinatura de email</h1>

  <form id="form" autocomplete="off" onsubmit="return false">
    <label>Nome <input type="text" id="name"></label>
    <label>Cargo <input type="text" id="role"></label>
    <label>Telemóvel <input type="text" id="phone" inputmode="tel"></label>
    <label>Site <input type="text" id="site" placeholder="www.exemplo.com"></label>
    <label>Morada <input type="text" id="address"></label>
    <label>Instagram (link) <input type="text" id="instagram" placeholder="https://instagram.com/..."></label>
    <label>Facebook (link) <input type="text" id="facebook" placeholder="https://facebook.com/..."></label>
    <label>LinkedIn (link) <input type="text" id="linkedin" placeholder="https://linkedin.com/..."></label>
    <small>Deixa um link vazio para esconder o ícone respetivo.</small>
    <label>Frase promocional <textarea id="tagline" rows="3"></textarea>
      <small>Uma linha em branco/Enter quebra a linha. Deixa vazio para não mostrar.</small></label>
    <fieldset>
      <legend>Versão</legend>
      <label><input type="radio" name="theme" value="light" checked> Clara</label>
      <label><input type="radio" name="theme" value="dark"> Escura</label>
    </fieldset>
    <label>Endereço das imagens
      <input type="text" id="baseUrl" placeholder="https://www.exemplo.com/assinatura/img/">
      <small>Pasta pública (https) onde estão os ficheiros da pasta <code>img/</code>.</small>
      <div id="baseUrlStatus" class="status" role="status"></div></label>
  </form>

  <section class="preview-panel">
    <h2>Pré-visualização</h2>
    <div id="preview"></div>
    <div class="actions">
      <button type="button" id="copy">Copiar assinatura</button>
      <button type="button" id="reset" class="secondary">Repor exemplo</button>
      <span id="message" role="status"></span>
    </div>
    <small>Depois de copiar, cola nas definições de assinatura do Gmail ou do Outlook (no Outlook: Ficheiro → Opções → Correio → Assinaturas).</small>
  </section>
</main>

<script src="signature.js"></script>
<script>
const FIELDS = ['name','role','phone','site','address','instagram','facebook','linkedin','tagline','baseUrl'];
const SAMPLE = {
  name: 'Sandra Pinho', role: 'Marketing Director', phone: '+351 935 870 103',
  site: 'www.quintadovallado.com', address: 'Praceta de Sagres, 105 | 4405-700 Gulpilhares, Portugal',
  instagram: 'https://www.instagram.com/', facebook: 'https://www.facebook.com/', linkedin: 'https://www.linkedin.com/',
  tagline: 'A magia da Passagem de Ano está de volta ao Douro.\nDe 29 de dezembro a 1 de janeiro, participe numa experiência de excelência.',
  baseUrl: 'https://oicnanev.github.io/mail-signature/img/', theme: 'light',
};
const $ = (id) => document.getElementById(id);
const STORAGE_KEY = 'signature:v1';

const loadSaved = () => { try { return { ...SAMPLE, ...JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') }; } catch { return { ...SAMPLE }; } };
const save = (data) => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {} };

const getTheme = () => document.querySelector('input[name=theme]:checked').value;
const getData = () => Object.fromEntries(FIELDS.map((f) => [f, $(f).value]));

function fillForm(data) {
  FIELDS.forEach((f) => ($(f).value = data[f] ?? ''));
  document.querySelector(`input[name=theme][value=${data.theme}]`).checked = true;
}

function refresh() {
  const data = getData();
  save({ ...data, theme: getTheme() });
  // the preview always uses the local images; the public URL only goes into the copied signature
  $('preview').innerHTML = build(data, getTheme(), 'img/');
  const isHttps = /^https:\/\/\S+\/$/.test(data.baseUrl.trim());
  $('baseUrlStatus').className = 'status ' + (isHttps ? 'ok' : 'error');
  $('baseUrlStatus').textContent = isHttps
    ? 'OK.'
    : 'Tem de começar por https:// e acabar em /. Sem isto, as imagens não aparecem nos emails.';
}

async function copySignature() {
  const data = getData();
  const html = build(data, getTheme(), data.baseUrl.trim());
  let ok = true;
  try {
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], { type: 'text/html' }),
      'text/plain': new Blob([$('preview').innerText], { type: 'text/plain' }),
    })]);
  } catch {
    // fallback for browsers/contexts without the async clipboard API
    const box = document.createElement('div');
    box.innerHTML = html;
    box.style.cssText = 'position:fixed;left:-9999px';
    document.body.append(box);
    const selection = getSelection(), range = document.createRange();
    range.selectNodeContents(box); selection.removeAllRanges(); selection.addRange(range);
    ok = document.execCommand('copy');
    selection.removeAllRanges(); box.remove();
  }
  $('message').textContent = ok ? 'Copiada. Cola nas definições de assinatura.' : 'Não foi possível copiar: seleciona a pré-visualização e usa Ctrl+C.';
  setTimeout(() => ($('message').textContent = ''), 5000);
}

fillForm(loadSaved());
$('form').addEventListener('input', refresh);
$('copy').addEventListener('click', copySignature);
$('reset').addEventListener('click', () => { fillForm(SAMPLE); refresh(); });
refresh();
</script>
</body>
</html>
